<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; padding: 2rem; }

        header { text-align: center; margin-bottom: 2rem; }

        h1 { font-size: 3rem; color: #7c6af7; letter-spacing: 4px; text-transform: uppercase; }

        .subtitle { color: #888; margin-top: 0.5rem; font-size: 0.9rem; letter-spacing: 2px; }

        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #7c6af7; margin-bottom: 1rem; }

        .status { display: flex; align-items: center; gap: 0.75rem; font-size: 1.1rem; }

        .dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        ul { list-style: none; }

        li { padding: 0.4rem 0; color: #aaa; font-size: 0.95rem; border-bottom: 1px solid #2a2a4a; }

        li:last-child { border-bottom: none; }

        strong { color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Webserv</h1>
            <p class="subtitle">HTTP Server in C++98</p>
        </header>
        <main>
            <div class="card">
                <h2>Server Status</h2>
                <div class="status">
                    <span class="dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="card">
                <h2>Request Info</h2>
                <ul>
                    <li>Method: <strong>GET</strong></li>
                    <li>Path: <strong id="path"></strong></li>
                    <li>Time: <strong id="time"></strong></li>
                </ul>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('path').textContent = window.location.pathname;
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    </script>
</body>
</html>
