<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; padding: 2rem; }

        header { text-align: center; margin-bottom: 2rem; }

        h1 { font-size: 3rem; color: #7c6af7; letter-spacing: 4px; text-transform: uppercase; }

        .subtitle { color: #888; margin-top: 0.5rem; font-size: 0.9rem; letter-spacing: 2px; }

        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #7c6af7; margin-bottom: 1rem; }

        .status { display: flex; align-items: center; gap: 0.75rem; font-size: 1.1rem; }

        .dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        ul { list-style: none; }

        li { padding: 0.4rem 0; color: #aaa; font-size: 0.95rem; border-bottom: 1px solid #2a2a4a; }

        li:last-child { border-bottom: none; }

        strong { color: #e0e0e0; }

        .upload-form { display: flex; flex-direction: column; gap: 1rem; }

        .file-drop {
            border: 2px dashed #2a2a4a;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            color: #888;
            font-size: 0.9rem;
        }

        .file-drop:hover, .file-drop.drag-over {
            border-color: #7c6af7;
            background: #16162a;
            color: #e0e0e0;
        }

        .file-drop input[type="file"] { display: none; }

        .file-name { font-size: 0.85rem; color: #7c6af7; margin-top: 0.5rem; min-height: 1.2em; }

        .btn {
            background: #7c6af7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn:hover { background: #5a49d6; }
        .btn:disabled { background: #3a3a5a; cursor: not-allowed; }

        .upload-msg { font-size: 0.85rem; min-height: 1.2em; text-align: center; }
        .upload-msg.ok { color: #4caf50; }
        .upload-msg.err { color: #f44336; }

        .delete-form { display: flex; flex-direction: column; gap: 1rem; }

        .text-input {
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus { border-color: #7c6af7; }

        .btn-delete {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn-delete:hover { background: #96281b; }
        .btn-delete:disabled { background: #3a3a5a; cursor: not-allowed; }

        .btn-download {
            background: #1a7a4a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn-download:hover { background: #145c38; }
        .btn-download:disabled { background: #3a3a5a; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Webserv</h1>
            <p class="subtitle">HTTP Server in C++98</p>
        </header>
        <main>
            <div class="card">
                <h2>Server Status</h2>
                <div class="status">
                    <span class="dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="card">
                <h2>Request Info</h2>
                <ul>
                    <li>Method: <strong>GET</strong></li>
                    <li>Path: <strong id="path"></strong></li>
                    <li>Time: <strong id="time"></strong></li>
                </ul>
            </div>
            <div class="card">
                <h2>Upload File</h2>
                <form class="upload-form" id="uploadForm">
                    <label class="file-drop" id="dropZone">
                        <input type="file" id="fileInput">
                        <span id="dropText">Click or drag a file here</span>
                        <div class="file-name" id="fileName"></div>
                    </label>
                    <button type="submit" class="btn" id="uploadBtn" disabled>Send (POST)</button>
                    <div class="upload-msg" id="uploadMsg"></div>
                </form>
            </div>
            <div class="card">
                <h2>Delete File</h2>
                <form class="delete-form" id="deleteForm">
                    <input class="text-input" type="text" id="deleteInput" placeholder="filename (e.g. photo.png)">
                    <button type="submit" class="btn-delete" id="deleteBtn" disabled>Delete (DELETE)</button>
                    <div class="upload-msg" id="deleteMsg"></div>
                </form>
            </div>
            <div class="card">
                <h2>Download File</h2>
                <form class="delete-form" id="downloadForm">
                    <input class="text-input" type="text" id="downloadInput" placeholder="filename (e.g. photo.png)">
                    <button type="submit" class="btn-download" id="downloadBtn" disabled>Download (GET)</button>
                    <div class="upload-msg" id="downloadMsg"></div>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('path').textContent = window.location.pathname;
        document.getElementById('time').textContent = new Date().toLocaleTimeString();

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadMsg = document.getElementById('uploadMsg');
        const uploadForm = document.getElementById('uploadForm');

        function setFile(file) {
            fileName.textContent = file ? file.name : '';
            uploadBtn.disabled = !file;
            uploadMsg.textContent = '';
            uploadMsg.className = 'upload-msg';
        }

        fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) { fileInput.files = e.dataTransfer.files; setFile(file); }
        });

        const deleteInput = document.getElementById('deleteInput');
        const deleteBtn = document.getElementById('deleteBtn');
        const deleteMsg = document.getElementById('deleteMsg');
        const deleteForm = document.getElementById('deleteForm');

        deleteInput.addEventListener('input', () => {
            deleteBtn.disabled = deleteInput.value.trim() === '';
            deleteMsg.textContent = '';
            deleteMsg.className = 'upload-msg';
        });

        deleteForm.addEventListener('submit', async e => {
            e.preventDefault();
            const filename = deleteInput.value.trim();
            if (!filename) return;
            deleteBtn.disabled = true;
            deleteMsg.textContent = 'Deleting...';
            deleteMsg.className = 'upload-msg';
            try {
                const res = await fetch('uploads/' + filename, { method: 'DELETE' });
                if (res.ok) {
                    deleteMsg.textContent = filename + ' deleted.';
                    deleteMsg.className = 'upload-msg ok';
                    deleteInput.value = '';
                } else {
                    deleteMsg.textContent = 'Error: ' + res.status + ' ' + res.statusText;
                    deleteMsg.className = 'upload-msg err';
                }
            } catch (err) {
                deleteMsg.textContent = 'Connection error.';
                deleteMsg.className = 'upload-msg err';
            }
            deleteBtn.disabled = false;
        });

        const downloadInput = document.getElementById('downloadInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadMsg = document.getElementById('downloadMsg');
        const downloadForm = document.getElementById('downloadForm');

        downloadInput.addEventListener('input', () => {
            downloadBtn.disabled = downloadInput.value.trim() === '';
            downloadMsg.textContent = '';
            downloadMsg.className = 'upload-msg';
        });

        downloadForm.addEventListener('submit', e => {
            e.preventDefault();
            const filename = downloadInput.value.trim();
            if (!filename) return;
            downloadMsg.textContent = '';
            downloadMsg.className = 'upload-msg';
            const a = document.createElement('a');
            a.href = 'uploads/' + encodeURIComponent(filename);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            downloadMsg.textContent = 'Download started: ' + filename;
            downloadMsg.className = 'upload-msg ok';
        });

        uploadForm.addEventListener('submit', async e => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;
            uploadBtn.disabled = true;
            uploadMsg.textContent = 'Sending...';
            uploadMsg.className = 'upload-msg';
            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch('/upload', { method: 'POST', body: formData });
                if (res.ok) {
                    uploadMsg.textContent = 'File sent successfully!';
                    uploadMsg.className = 'upload-msg ok';
                    fileInput.value = '';
                    setFile(null);
                } else {
                    uploadMsg.textContent = 'Error: ' + res.status + ' ' + res.statusText;
                    uploadMsg.className = 'upload-msg err';
                }
            } catch (err) {
                uploadMsg.textContent = 'Connection error.';
                uploadMsg.className = 'upload-msg err';
            }
            uploadBtn.disabled = false;
        });
    </script>
</body>
</html>
