<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Webserv2</h1>
            <p class="subtitle">HTTP Server in C++98</p>
        </header>
        <main>
            <div class="card">
                <div class="clock" id="clock"> : : </div>
                <button class="btn-cgi" onclick="getTime()">Get Time</button>
            </div>
        </main>
    </div>
    <script>
        function getTime() {
            fetch('/cgi-bin/time.py')
                .then(function(res) { return res.text(); })
                .then(function(text) { document.getElementById('clock').textContent = text.trim(); });
        }
    </script>
</body>
</html>
