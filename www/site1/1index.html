<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Webserv</h1>
            <p class="subtitle">HTTP Server in C++98</p>
        </header>
        <main>
            <div class="card">
                <h2>Server Status</h2>
                <div class="status">
                    <span class="dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="card">
                <h2>Request Info</h2>
                <ul>
                    <li>Method: <strong>GET</strong></li>
                    <li>Path: <strong id="path"></strong></li>
                    <li>Time: <strong id="time"></strong></li>
                </ul>
            </div>
            <div class="card">
                <h2>Features</h2>
                <ul>
                    <li><a href="/upload.html">Upload File</a></li>
                    <li><a href="/delete.html">Delete File</a></li>
                    <li><a href="/download.html">Download File</a></li>
                </ul>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('path').textContent = window.location.pathname;
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    </script>
</body>
</html>
