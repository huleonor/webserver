<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tours</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.5rem; color: #7c6af7; letter-spacing: 3px; text-transform: uppercase; }
        .subtitle { color: #888; margin-top: 0.5rem; font-size: 0.9rem; letter-spacing: 2px; }
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #7c6af7; margin-bottom: 1rem; }
        .badge {
            display: inline-block;
            background: #2a2a4a;
            border: 1px solid #7c6af7;
            color: #7c6af7;
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        p { color: #aaa; line-height: 1.6; }
        a { color: #7c6af7; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tours</h1>
            <p class="subtitle">You were redirected here</p>
        </header>
        <main>
            <div class="card">
                <h2>Redirect Info</h2>
                <span class="badge">301 Moved Permanently</span>
                <p>You came from <strong>/red</strong> and were redirected to <strong>/tours</strong>.</p>
            </div>
            <div class="card">
                <h2>Navigation</h2>
                <p><a href="/">← Back to home</a></p>
            </div>
        </main>
    </div>
</body>
</html>
