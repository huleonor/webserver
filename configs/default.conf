server {
    listen 8002;
	server_name localhost;
    host 0.0.0.0;
    root www/site1;
    client_max_body_size 300000;
	index index.html;
    error_page 404 error_pages/404.html;
    error_page 405 error_pages/405.html;

    location / {
        allow_methods GET;
        autoindex off;
    }

    location /tours {
        autoindex on;
        index tours1.html;
        allow_methods GET POST;
    }

	location /red {
		allow_methods GET;
		return 301 /tours;
	}

    location /upload {
		autoindex on;
        allow_methods POST DELETE GET;
        upload_path www/uploads;
    }

    location /cgi-bin {
        root ./cgi-bin;
        allow_methods GET POST;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}

